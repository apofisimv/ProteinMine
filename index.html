<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>ProteinMine</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:linear-gradient(-45deg,#0a0e27,#1a1a3e,#302b63);background-size:400% 400%;animation:g 15s ease infinite;height:100vh;color:#fff;overflow-x:hidden}
@keyframes g{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
.c{text-align:center;padding:20px;width:100%;max-width:400px;margin:0 auto}
h1{font-size:28px;background:linear-gradient(90deg,#0ff,#f0f);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:15px}
.tabs{display:flex;gap:10px;margin-bottom:20px}
.tab{flex:1;padding:12px;background:rgba(10,10,30,.6);border:2px solid rgba(0,255,255,.3);border-radius:10px;color:#0ff;cursor:pointer;font-size:16px;font-weight:bold}
.tab.active{background:rgba(0,255,255,.2);border-color:#0ff}
.page{display:none}
.page.active{display:block}
.s{background:rgba(10,10,30,.6);backdrop-filter:blur(20px);border-radius:20px;padding:25px;margin:20px 0;border:2px solid rgba(0,255,255,.3)}
.p{font-size:56px;background:linear-gradient(135deg,#0ff,#ff0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:15px 0;font-weight:bold}
.i{font-size:18px;margin:10px 0;opacity:0.9}
.i span{color:#0ff}
.e{width:100%;height:20px;background:rgba(0,255,255,0.2);border-radius:10px;overflow:hidden;margin-top:15px}
.eb{height:100%;background:linear-gradient(90deg,#0ff,#00ff88);transition:width 0.3s}
.et{margin-top:8px;font-size:16px;color:#0ff;font-weight:bold}
.b{width:180px;height:180px;border-radius:50%;background:linear-gradient(135deg,#0ff,#f0f);color:#fff;font-size:32px;font-weight:bold;border:none;cursor:pointer;margin:30px auto;display:block;box-shadow:0 0 30px rgba(0,255,255,0.5);transition:transform 0.1s;-webkit-tap-highlight-color:transparent}
.b:active{transform:scale(0.95)}
#map{height:400px;border-radius:15px;margin:20px 0;border:2px solid rgba(0,255,255,.3)}
.map-info{background:rgba(10,10,30,.8);padding:15px;border-radius:10px;margin-top:10px;font-size:14px}
</style>
</head>
<body>
<div class="c">
<h1>🧬 PROTEINMINE</h1>

<div class="tabs">
<div class="tab active" onclick="showPage('mine')">⛏️ Mine</div>
<div class="tab" onclick="showPage('map')">🗺️ Map</div>
</div>

<div id="minePage" class="page active">
<div class="s">
<div class="p" id="p">0</div>
<div class="i">💰 <span>PROTEIN</span></div>
<div class="i">⭐ <span id="lvl">LEVEL 1</span></div>
<div class="i">📊 <span id="xp">XP: 0/100</span></div>
<div class="i">⚡ <span>ENERGY</span></div>
<div class="e"><div class="eb" id="eb"></div></div>
<div class="et" id="et">50/50</div>
</div>
<button class="b" id="btn">⛏️ MINE</button>
</div>

<div id="mapPage" class="page">
<div class="s">
<h2 style="color:#0ff;margin-bottom:15px">🗺️ Protein Zones</h2>
<div id="map"></div>
<div class="map-info">
<div>📍 Your Location: <span id="userLoc">Detecting...</span></div>
<div>🧬 Nearby Protein: <span id="nearProtein">0</span></div>
</div>
</div>
</div>

</div>

<script>
let d={protein:0,energy:50,maxEnergy:50,level:1,xp:0,lat:51.1079,lng:17.0385};
let map,userMarker;

function u(){
document.getElementById('p').textContent=d.protein;
document.getElementById('et').textContent=d.energy+'/'+d.maxEnergy;
document.getElementById('eb').style.width=(d.energy/d.maxEnergy*100)+'%';
document.getElementById('lvl').textContent='LEVEL '+d.level;
document.getElementById('xp').textContent='XP: '+d.xp+'/100';
}

function m(){
if(d.energy<=0){alert('⚡ No energy!');return;}
d.energy--;
d.protein+=5;
d.xp+=5;
if(d.xp>=100){d.level++;d.xp=0;}
u();
}

function showPage(page){
document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
if(page==='mine'){
document.getElementById('minePage').classList.add('active');
document.querySelectorAll('.tab')[0].classList.add('active');
}else if(page==='map'){
document.getElementById('mapPage').classList.add('active');
document.querySelectorAll('.tab')[1].classList.add('active');
if(!map)initMap();
}
}

function initMap(){
map=L.map('map').setView([d.lat,d.lng],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
attribution:'© OpenStreetMap'
}).addTo(map);

userMarker=L.marker([d.lat,d.lng]).addTo(map)
.bindPopup('You are here!').openPopup();

// Example protein zones
let zones=[
{lat:51.11,lng:17.04,protein:100},
{lat:51.10,lng:17.05,protein:150},
{lat:51.12,lng:17.03,protein:200}
];

zones.forEach(z=>{
L.circle([z.lat,z.lng],{
color:'#0ff',
fillColor:'#f0f',
fillOpacity:0.3,
radius:500
}).addTo(map).bindPopup(`🧬 Protein: ${z.protein}`);
});

if(navigator.geolocation){
navigator.geolocation.getCurrentPosition(pos=>{
d.lat=pos.coords.latitude;
d.lng=pos.coords.longitude;
map.setView([d.lat,d.lng],13);
userMarker.setLatLng([d.lat,d.lng]);
document.getElementById('userLoc').textContent=d.lat.toFixed(4)+', '+d.lng.toFixed(4);
});
}
}

document.getElementById('btn').addEventListener('click',m);
if(window.Telegram?.WebApp){Telegram.WebApp.expand();}
u();
setInterval(function(){if(d.energy<d.maxEnergy){d.energy++;u();}},5000);
</script>
</body>
</html>
